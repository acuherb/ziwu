<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="中医时辰开穴：子午流注·灵龟八法·飞腾八法·五运六气·五门十变，支持余5寄宫、复制、打印">
<title>中医时辰开穴 · 综合版</title>
<style>
:root{
  --paper:#f6efdd; --paper2:#efe5cb; --card:#fffdf4; --ink:#2c2720; --ink2:#6b5f4d;
  --red:#8c1f28; --red2:#b03a2e; --gold:#b8860b; --line:#e0d4b6; --green:#3f6b3f; --blue:#2a5b8c;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Noto Serif SC","Songti SC","SimSun","STSong",serif;
  background:linear-gradient(180deg,var(--paper) 0%,var(--paper2) 100%);
  color:var(--ink); line-height:1.6; font-size:15px;
  background-image:radial-gradient(circle at 20% 10%, rgba(140,31,40,.05), transparent 40%),
                   radial-gradient(circle at 80% 90%, rgba(184,134,11,.07), transparent 40%);
}
header.top{
  background:linear-gradient(135deg,#7c161d 0%,#9c2a32 60%,#b03a2e 100%);
  color:#f8efdc; text-align:center; padding:18px 14px 14px; border-bottom:4px solid #5f0f15;
}
header.top h1{font-size:1.5rem; letter-spacing:.35em; text-indent:.35em; font-weight:700}
header.top .sub{font-size:.8rem; opacity:.85; letter-spacing:.18em; margin-top:4px; text-wrap:balance}
#clockBar{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:10px; align-items:baseline}
#clockBar .big{font-size:1.9rem; font-weight:700; font-family:"Times New Roman",serif; letter-spacing:.05em}
#clockBar .sc{color:#f0c060; font-size:1.1rem; font-weight:700}
#clockBar .ganzi{font-size:.95rem; background:rgba(0,0,0,.25); padding:2px 10px; border-radius:20px; border:1px solid rgba(255,255,255,.25)}
nav.tabs{
  display:flex; gap:6px; padding:10px 12px; overflow-x:auto; background:var(--paper);
  position:sticky; top:0; z-index:50; box-shadow:0 2px 8px rgba(60,40,10,.12);
  justify-content:center;
}
/* 手机窄屏时改回左对齐，避免首个标签被截断 */
@media (max-width: 500px){
  nav.tabs{ justify-content:flex-start; }
}
nav.tabs button{
  flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:8px 16px; border-radius:24px; font-size:.95rem; cursor:pointer; font-family:inherit;
  letter-spacing:.1em; transition:.2s;
}
nav.tabs button.active{background:var(--red); color:#fff; border-color:var(--red)}
nav.tabs button:hover:not(.active){background:#fff}
main{max-width:980px; margin:0 auto; padding:14px 12px 60px}
section.tab{display:none}
section.tab.active{display:block; animation:fadein .25s}
@keyframes fadein{from{opacity:0; transform:translateY(4px)}to{opacity:1}}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; margin-bottom:14px; box-shadow:0 1px 4px rgba(80,60,20,.08);
}
.card h3{font-size:1.05rem; color:var(--red); letter-spacing:.15em; margin-bottom:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.card h3 .tag{font-size:.7rem; background:var(--red); color:#fff; border-radius:10px; padding:1px 8px; letter-spacing:.05em}
.card h3 .tag.blue{background:var(--blue)}
.grid{display:grid; gap:14px}
@media(min-width:720px){.grid.c2{grid-template-columns:1fr 1fr}}
table.tbl{width:100%; border-collapse:collapse; font-size:.88rem; margin-top:6px}
table.tbl th,table.tbl td{border:1px solid var(--line); padding:5px 8px; text-align:center}
table.tbl th{background:#f3ead2; color:#5f3a12; font-weight:600}
table.tbl tr.cur td{background:#fdeeda; font-weight:600; color:var(--red)}
table.tbl tr:nth-child(even):not(.cur) td{background:rgba(243,234,210,.4)}
.point-chip{
  display:inline-block; background:#fff; border:1px solid var(--red2); color:var(--red);
  border-radius:14px; padding:2px 10px; margin:3px 4px 3px 0; font-size:.85rem; cursor:default;
}
.point-chip b{font-size:.95rem}
.badge{display:inline-block; border-radius:10px; padding:0 8px; font-size:.72rem; margin-left:6px; vertical-align:middle}
.badge.nj{background:#fde8d7; color:#9c4a00; border:1px solid #f0c090}
.badge.nz{background:#e4f0e4; color:var(--green); border:1px solid #b8d4b8}
.badge.lg{background:#e8e0f5; color:#5b3fa0; border:1px solid #c4b4e4}
.badge.ft{background:#e0f0f4; color:#1f6d7a; border:1px solid #a8d4dc}
.badge.wm{background:#f5ecd8; color:#8a6d1a; border:1px solid #d8c48a}
.calc-line{font-size:.82rem; color:var(--ink2); margin:4px 0}
.small{font-size:.78rem; color:var(--ink2)}
.note{font-size:.8rem; background:#fbf4e0; border-left:3px solid var(--gold); padding:8px 12px; border-radius:0 8px 8px 0; margin-top:8px}
.flex{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
input[type=date],input[type=time],input[type=number],select{
  font-family:inherit; font-size:.95rem; padding:6px 8px; border:1px solid var(--line);
  border-radius:8px; background:#fff; color:var(--ink);
}
button.btn{
  font-family:inherit; border:1px solid var(--red); background:var(--red); color:#fff;
  padding:7px 16px; border-radius:20px; cursor:pointer; font-size:.9rem; letter-spacing:.1em;
}
button.btn.ghost{background:#fff; color:var(--red)}
button.btn:hover{opacity:.88}
.switch{display:flex; align-items:center; gap:6px; font-size:.88rem; cursor:pointer; user-select:none}
.switch input{accent-color:var(--red); width:16px; height:16px}
.needle-list{list-style:none}
.needle-list li{display:flex; align-items:flex-start; gap:10px; padding:8px 4px; border-bottom:1px dashed var(--line)}
.needle-list li:last-child{border-bottom:none}
.needle-list .nm{font-size:1.05rem; font-weight:700; color:var(--red); min-width:52px}
.needle-list .jm{font-size:.82rem; color:var(--ink2); margin-top:2px}
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
.cal-head button{border:1px solid var(--line); background:#fff; border-radius:8px; padding:4px 12px; cursor:pointer; font-family:inherit; font-size:.9rem}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.cal-cell{border:1px solid var(--line); background:#fffdf6; border-radius:6px; padding:4px 3px; min-height:58px; cursor:pointer; font-size:.75rem; text-align:center; position:relative}
.cal-cell .d{font-size:1rem; font-weight:600}
.cal-cell .l{font-size:.68rem; color:var(--ink2)}
.cal-cell .gz{font-size:.62rem; color:#a07a2a}
.cal-cell.term{border-color:var(--red2); background:#fdf0e6}
.cal-cell.term .l{color:var(--red)}
.cal-cell.today{border:2px solid var(--gold); background:#fdf6de}
.cal-cell.selected{background:#f3d9d9; border-color:var(--red)}
.cal-cell .term-mark{position:absolute; top:2px; right:3px; font-size:.6rem; color:var(--red)}
.cal-cell.weekend .d{color:var(--red)}
.cal-cell.other .d{opacity:.35}
.week-row{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:4px}
.week-row span{text-align:center; font-size:.75rem; color:var(--ink2)}
.yunqi-big{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:6px 0}
.yunqi-big .yq-item{background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 14px; text-align:center; min-width:110px}
.yunqi-big .yq-item .k{font-size:.7rem; color:var(--ink2)}
.yunqi-big .yq-item .v{font-size:1.15rem; font-weight:700; color:var(--red)}
.stepbar{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0}
.stepbar .st{flex:1 1 90px; min-width:80px; text-align:center; border:1px solid var(--line); border-radius:8px; padding:6px 4px; background:#fff}
.stepbar .st.cur{background:#fdeeda; border-color:var(--red2)}
.stepbar .st .n{font-size:.7rem; color:var(--ink2)}
.stepbar .st .v{font-weight:700}
footer{text-align:center; font-size:.75rem; color:var(--ink2); padding:18px 12px 30px; border-top:1px solid var(--line); margin-top:10px}
footer .warn{color:var(--red); font-weight:600}
.disc{font-size:.78rem; color:var(--ink2); margin-top:8px}
.poem{font-family:"STKaiti","KaiTi",serif; background:#faf3e0; border:1px dashed var(--gold); border-radius:8px; padding:10px 14px; margin:8px 0; font-size:.92rem; line-height:2}
.poem .t{color:var(--red); font-weight:700}
.opt-bar{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
@media(max-width:600px){.opt-bar{grid-template-columns:1fr}}
.opt-item{background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 12px; display:flex; align-items:center; gap:8px; font-size:.85rem}
.opt-item label{flex:0 0 auto; color:var(--ink2)}
.opt-item select{flex:1; min-width:0}
.opt-item.disabled{opacity:.5}
.copy-toast{
  position:fixed; left:50%; bottom:36px; transform:translateX(-50%) translateY(20px);
  background:rgba(60,40,20,.92); color:#fff; padding:10px 22px; border-radius:22px;
  font-size:.9rem; opacity:0; pointer-events:none; transition:.3s; z-index:200;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
}
.copy-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
@media print {
  body{background:#fff}
  header.top{background:#fff !important; color:#000 !important; border-bottom:2px solid #000}
  #clockBar .ganzi{background:#eee !important; color:#000 !important; border-color:#999 !important}
  #clockBar .sc{color:#000 !important}
  nav.tabs, .opt-bar, button.btn, .copy-toast, .cal-head button, footer{display:none !important}
  section.tab:not(.active){display:none !important}
  .card{box-shadow:none; border-color:#888; break-inside:avoid}
  .card h3 .tag{background:#666 !important}
  main{padding:0}
}
</style>
</head>
<body>

<header class="top">
  <h1>中医时辰开穴</h1>
  <div class="sub">子午流注 · 灵龟八法 · 飞腾八法 · 五运六气 · 五门十变</div>
  <div id="clockBar">
    <span class="big" id="clockTime">--:--:--</span>
    <span class="ganzi" id="clockGanzi">----</span>
  </div>
</header>

<nav class="tabs">
  <button data-tab="open" class="active">⏱ 即时开穴</button>
  <button data-tab="cal">📅 万年历</button>
  <button data-tab="yunqi">☯ 五运六气</button>
  <button data-tab="wumen">🕯 五门十变</button>
  <button data-tab="about">📖 说明</button>
</nav>

<main>
<section class="tab active" id="tab-open">
  <div class="card">
    <h3>⏱ 输入时间，即刻开穴 <span class="tag">针灸下针参考</span></h3>
    <div class="flex" style="margin-bottom:8px">
      <label class="switch"><input type="checkbox" id="optFollow" checked>跟随当前时间</label>
      <label class="switch"><input type="checkbox" id="optLateZi" checked>23:00后子时按次日干支</label>
      <label class="switch"><input type="checkbox" id="optAuto" checked>每分钟自动刷新</label>
    </div>
    <div class="flex">
      <input type="date" id="dateInput">
      <input type="time" id="timeInput">
      <button class="btn ghost" id="btnNow">回到此刻</button>
      <button class="btn" id="btnCopy">复制结果</button>
      <button class="btn ghost" id="btnPrint">打印</button>
    </div>
    <div class="opt-bar">
      <div class="opt-item">
        <label>余数5处理</label>
        <select id="optFive">
          <option value="kun">余5按中宫寄坤（照海）</option>
          <option value="gender">余5按性别寄宫</option>
        </select>
      </div>
      <div class="opt-item disabled" id="sexOptBox">
        <label>性别</label>
        <select id="optSex" disabled>
          <option value="male">男：寄坤 → 照海</option>
          <option value="female">女：寄艮 → 内关</option>
        </select>
      </div>
    </div>
  </div>
  <div class="card" id="ganzhiSummary"></div>
  <div class="card" id="summaryCard"></div>
  <div class="grid c2">
    <div class="card" id="cardNajia"></div>
    <div class="card" id="cardNazi"></div>
    <div class="card" id="cardLinggui"></div>
    <div class="card" id="cardFeiteng"></div>
    <div class="card" id="cardWumen"></div>
    <div class="card" id="cardYunqiMini"></div>
  </div>
  <div class="card" id="cardDayTable"></div>
</section>

<section class="tab" id="tab-cal">
  <div class="card">
    <h3>📅 万年历 <span class="tag">农历 · 干支 · 节气</span></h3>
    <div class="cal-head">
      <button id="calPrev">‹ 上月</button>
      <span id="calTitle" style="font-size:1.05rem;font-weight:700"></span>
      <button id="calNext">下月 ›</button>
    </div>
    <div class="week-row">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <p class="note">点击任意日期可设为开穴时间。日干支以子时（23:00）换日；农历日期按公历日显示。</p>
  </div>
</section>

<section class="tab" id="tab-yunqi">
  <div class="card">
    <h3>☯ 五运六气 <span class="tag">运气学说</span></h3>
    <div class="flex">
      <button class="btn ghost" id="yqPrev">‹ 上一年</button>
      <input type="number" id="yqYear" min="1900" max="2100" style="width:90px;text-align:center">
      <button class="btn ghost" id="yqNext">下一年 ›</button>
      <span class="small">岁运以立春交接</span>
    </div>
    <div id="yqContent"></div>
  </div>
</section>

<section class="tab" id="tab-wumen">
  <div class="card" id="wmContent"></div>
</section>

<section class="tab" id="tab-about">
  <div class="card" id="aboutContent"></div>
</section>
</main>

<footer>
  <div class="warn">⚠ 本工具仅供中医理论学习与参考，不构成医疗建议。针刺操作须由具备资质的专业医师进行。</div>
  <div class="disc">历法数据由 lunar-javascript 天文算法提供（Meeus 法）。节气/农历按浏览器本地时区计算，如需真太阳时请自行校正。</div>
</footer>

<div class="copy-toast" id="toast">已复制到剪贴板</div>

<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.1/lunar.js"></script>
<script>
/* CDN fallback */
if (typeof Solar === 'undefined') {
  document.write('<script src="https://unpkg.com/lunar-javascript@1.7.1/lunar.js"><\/script>');
}
</script>
<script>
/*__CORE_START__*/
(function(){
'use strict';

if (typeof Solar === 'undefined' || typeof Lunar === 'undefined') {
  var main = document.querySelector('main');
  if (main) main.innerHTML = '<div class="card"><h3>⚠ 历法库加载失败</h3>' +
    '<p>本工具需要联网加载 <b>lunar-javascript</b> 历法库（jsDelivr / unpkg）。请检查网络连接后刷新页面，或下载 lunar.js 放到同目录后修改引用路径。</p></div>';
  return;
}

/* ================= 基础工具 ================= */
const GAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const ZHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const SHENGXIAO = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
const WX = ['木','火','土','金','水'];
const mod = (n,m) => ((n % m) + m) % m;
const ganziName = idx => GAN[mod(idx,10)] + ZHI[mod(idx,12)];
const pad2 = n => (n < 10 ? '0' : '') + n;

/* 日干支：1949-10-01 = 甲子(0) */
function dayGanzhiIndex(y,m,d){
  return mod(Math.round((Date.UTC(y,m-1,d) - Date.UTC(1949,9,1)) / 86400000), 60);
}
/* 五鼠遁：时干 */
function hourStem(dayStem, branchIdx){ return mod(dayStem*2 + branchIdx, 10); }
/* 时支序 */
function hourBranchIdx(h){ return mod(Math.floor((h + 1) / 2), 12); }
/* 五虎遁 */
function monthStem(yearStem, mb){ return mod(yearStem*2 + mb + 2, 10); }

/* ================= 节气（lunar-javascript） ================= */
const TERM_CACHE = {};
function termTable(year){
  if (!TERM_CACHE[year]) TERM_CACHE[year] = Solar.fromYmd(year, 6, 30).getLunar().getJieQiTable();
  return TERM_CACHE[year];
}
function solarTermTimeMs(year, lambda){
  const t = (lambda === 270) ? termTable(year + 1)['冬至'] : termTable(year)[TERM_BY_L[lambda]];
  const p = t._p;
  return new Date(p.year, p.month - 1, p.day, p.hour, p.minute, p.second).getTime();
}
const TERMS = [
  {n:'小寒',l:285},{n:'大寒',l:300},{n:'立春',l:315},{n:'雨水',l:330},{n:'惊蛰',l:345},
  {n:'春分',l:0},{n:'清明',l:15},{n:'谷雨',l:30},{n:'立夏',l:45},{n:'小满',l:60},
  {n:'芒种',l:75},{n:'夏至',l:90},{n:'小暑',l:105},{n:'大暑',l:120},{n:'立秋',l:135},
  {n:'处暑',l:150},{n:'白露',l:165},{n:'秋分',l:180},{n:'寒露',l:195},{n:'霜降',l:210},
  {n:'立冬',l:225},{n:'小雪',l:240},{n:'大雪',l:255},{n:'冬至',l:270}
];
const TERM_BY_L = {}; TERMS.forEach(t => TERM_BY_L[t.l] = t.n);

/* 农历 */
function lunarInfo(y, m, d){
  const lu = Solar.fromYmd(y, m, d).getLunar();
  const mo = lu.getMonth();
  const isLeap = mo < 0;
  let mc = lu.getMonthInChinese();
  if (mc === '冬') mc = '十一';
  if (mc === '腊') mc = '十二';
  if (mc === '闰冬') mc = '闰十一';
  if (mc === '闰腊') mc = '闰十二';
  return {
    lunarYear: lu.getYear(), monthNum: mo, isLeap, day: lu.getDay(),
    monthName: mc + '月', dayName: lu.getDayInChinese()
  };
}

/* ================= 穴位数据 ================= */
const MERIDIANS = [
  {name:'肺经', wx:'金', yin:true,  j:'少商', x:'鱼际', shu:'太渊', jing:'经渠', he:'尺泽', yuan:'太渊'},
  {name:'大肠经', wx:'金', yin:false, j:'商阳', x:'二间', shu:'三间', jing:'阳溪', he:'曲池', yuan:'合谷'},
  {name:'胃经', wx:'土', yin:false, j:'厉兑', x:'内庭', shu:'陷谷', jing:'解溪', he:'足三里', yuan:'冲阳'},
  {name:'脾经', wx:'土', yin:true,  j:'隐白', x:'大都', shu:'太白', jing:'商丘', he:'阴陵泉', yuan:'太白'},
  {name:'心经', wx:'火', yin:true,  j:'少冲', x:'少府', shu:'神门', jing:'灵道', he:'少海', yuan:'神门'},
  {name:'小肠经', wx:'火', yin:false, j:'少泽', x:'前谷', shu:'后溪', jing:'阳谷', he:'小海', yuan:'腕骨'},
  {name:'膀胱经', wx:'水', yin:false, j:'至阴', x:'通谷', shu:'束骨', jing:'昆仑', he:'委中', yuan:'京骨'},
  {name:'肾经', wx:'水', yin:true,  j:'涌泉', x:'然谷', shu:'太溪', jing:'复溜', he:'阴谷', yuan:'太溪'},
  {name:'心包经', wx:'火', yin:true,  j:'中冲', x:'劳宫', shu:'大陵', jing:'间使', he:'曲泽', yuan:'大陵'},
  {name:'三焦经', wx:'火', yin:false, j:'关冲', x:'液门', shu:'中渚', jing:'支沟', he:'天井', yuan:'阳池'},
  {name:'胆经', wx:'木', yin:false, j:'窍阴', x:'侠溪', shu:'临泣', jing:'阳辅', he:'阳陵泉', yuan:'丘墟'},
  {name:'肝经', wx:'木', yin:true,  j:'大敦', x:'行间', shu:'太冲', jing:'中封', he:'曲泉', yuan:'太冲'}
];
const MERIDIAN_BY_NAME = {}; MERIDIANS.forEach(md => MERIDIAN_BY_NAME[md.name] = md);

const NAJIA_MAP = {};
(function(){
  const Z0 = [10,9,8,7,6,5,4,3,2,11];
  for (let r = 0; r < 10; r++){
    const startH = mod(2*Z0[r] - 1, 24);
    for (let i = 0; i < 6; i++){
      const z = mod(Z0[r] + 2*i, 12);
      const g = mod(r + 2*i, 10);
      const clock = mod(startH + 4*i, 24);
      const dayG = (clock >= 23 || clock < startH) ? mod(r + 1, 10) : r;
      const pt = NAJIA_POINTS[r][i];
      NAJIA_MAP[dayG + ',' + g + ',' + z] = {point: pt[0], meridian: pt[1], type: pt[2],
                                             yuan: (pt[2] === '输') ? GAN_YUAN[r] : null};
    }
  }
})();
function najiaOpen(dayStem0, hStem, hBranch){
  return NAJIA_MAP[dayStem0 + ',' + hStem + ',' + hBranch] || null;
}
function najiaHeRi(dayStem0, hStem, hBranch){
  return NAJIA_MAP[mod(dayStem0 + 5, 10) + ',' + hStem + ',' + hBranch] || null;
}

                9:['离','列缺','任脉']};
const LG_PEIDUI = {'公孙':'内关','内关':'公孙','后溪':'申脉','申脉':'后溪','临泣':'外关','外关':'临泣','列缺':'照海','照海':'列缺'};
const LG_PEIDUI_MAI = {'公孙':'冲脉','内关':'阴维','后溪':'督脉','申脉':'阳跷','临泣':'带脉','外关':'阳维','列缺':'任脉','照海':'阴跷'};

function lingguiOpen(dayG, hStem, hBranch, opts){
  const dG = mod(dayG,10), dZ = mod(dayG,12);
  const dayBase = LG_DAY_GAN[dG] + LG_DAY_ZHI[dZ];
  const hourBase = LG_HOUR_GAN[hStem] + LG_HOUR_ZHI[hBranch];
  const sum = dayBase + hourBase;
  const yangDay = (dG % 2 === 0);
  const div = yangDay ? 9 : 6;
  let rem = sum % div; if (rem === 0) rem = div;

  /* 余数5 处理 */
  let effectiveRem = rem;
  let note = '';
  if (rem === 5){
    if (opts && opts.fiveMode === 'gender'){
      if (opts.sex === 'female'){
        effectiveRem = 8;
        note = '余数5：按「女寄艮」处理，取内关。';
      } else {
        effectiveRem = 2;
        note = '余数5：按「男寄坤」处理，取照海。';
      }
    } else {
      effectiveRem = 2;
      note = '余数5：按「中宫寄坤」处理，取照海。';
    }
  }
  const gua = LG_GUA[effectiveRem];
  return {dayBase, hourBase, sum, div, rem, effectiveRem, gua, note,
          peidui: LG_PEIDUI[gua[1]], peiduiMai: LG_PEIDUI_MAI[gua[1]] || '', yangDay,
          step: '日基数（' + GAN[dG] + '=' + LG_DAY_GAN[dG] + ' + ' + ZHI[dZ] + '=' + LG_DAY_ZHI[dZ] + '）＝' + dayBase +
                '；时基数（' + GAN[hStem] + '=' + LG_HOUR_GAN[hStem] + ' + ' + ZHI[hBranch] + '=' + LG_HOUR_ZHI[hBranch] + '）＝' + hourBase +
                '；和＝' + sum + '；' + (yangDay ? '阳日' : '阴日') + ' ÷ ' + div + ' 余 ' + rem};
}

  '少阴君火':'热气当令：易病心系、热证、咽干、心烦、失眠',
  '太阴湿土':'湿气当令：易病脾胃、湿证、腹胀、身重、泄泻',
  '少阳相火':'火气当令：易病暑热、心包三焦、口苦、目赤',
  '阳明燥金':'燥气当令：易病肺系、燥证、咳喘、便秘、皮肤干',
  '太阳寒水':'寒气当令：易病肾系、寒证、腰痛、畏寒、关节痛'
};
function yunqiYearData(y){
  const yG = mod(y - 1984, 60);
  const gan = mod(yG, 10), zhi = mod(yG, 12);
  const yun = YUN_BY_GAN[gan];
  const taiGuo = (gan % 2 === 0);
  const siTian = SI_TIAN_BY_ZHI[zhi];
  const zaiQuan = ZAI_QUAN[zhi];
  const zaiQuanWx = QI_WX[zaiQuan];
  const ke = {木:'金',火:'水',土:'木',金:'火',水:'土'};
  const isTianFu = yun === siTian[1];
  const isSuiHui = yun === ZHI_WX[zhi] && ![2,5,8,11].includes(zhi);
  const isTaiYi = isTianFu && isSuiHui && gan !== 1;
  const zaiQuanSame = (yun === zaiQuanWx) && !(yun === '火' && zaiQuan === '少阴君火');
  const isTongTianFu = taiGuo && zaiQuanSame;
  const isTongSuiHui = !taiGuo && zaiQuanSame;
  const isPingQi = (taiGuo && ke[yun] === siTian[1]) || (!taiGuo && yun === siTian[1]);
  const tags = [];
  if (isTaiYi) tags.push('太一天符');
  if (isTianFu) tags.push('天符');
  if (isSuiHui) tags.push('岁会');
  if (isTongTianFu) tags.push('同天符');
  if (isTongSuiHui) tags.push('同岁会');
  if (isPingQi) tags.push('平气');
  const cat = tags.length ? tags.join('·') : (taiGuo ? '岁运太过' : '岁运不及');
  const zhuYun = [];
  let shao = !taiGuo;
  for (let i = 0; i < 5; i++){ zhuYun.push({wx: WX[i], yin: YUN_YIN[i], tai: !shao}); shao = !shao; }
  const keYun = [];
  shao = !taiGuo;
  let wxIdx = WX.indexOf(yun);
  for (let i = 0; i < 5; i++){
    keYun.push({wx: WX[mod(wxIdx + i, 5)], yin: YUN_YIN[mod(wxIdx + i, 5)], tai: !shao});
    shao = !shao;
  }
  const sIdx = QI_SEQ.indexOf(siTian[0]);
  const keQi = [];
  for (let i = 0; i < 6; i++) keQi.push(QI_SEQ[mod(sIdx + i + 4, 6)]);
  const jiaLin = ZHU_QI.map((zq, i) => {
    const kq = keQi[i], kw = QI_WX[kq], zw = QI_WX[zq.qi];
    let judge;
    if (kw === zw) judge = '同气相得';
    else if ((kw === '木' && zw === '土') || (kw === '火' && zw === '金') || (kw === '土' && zw === '水') ||
             (kw === '金' && zw === '木') || (kw === '水' && zw === '火')) judge = '客克主·顺（相得）';
    else if ((zw === '木' && kw === '土') || (zw === '火' && kw === '金') || (zw === '土' && kw === '水') ||
             (zw === '金' && kw === '木') || (zw === '水' && kw === '火')) judge = '主克客·逆（不相得）';
    else judge = '相生·相得';
    return {zq, kq, judge};
  });
  return {y, yG, gan, zhi, ganName: GAN[gan], zhiName: ZHI[zhi], yun, taiGuo, siTian, zaiQuan, cat,
          isTianFu, isTaiYi, isSuiHui, isTongTianFu, isTongSuiHui, isPingQi,
          zhuYun, keYun, keQi, jiaLin, shengxiao: SHENGXIAO[zhi],
          yunBing: YUN_BING[yun + (taiGuo ? '太过' : '不及')],
          siTianBing: SI_TIAN_BING[siTian[0]]};
}
function currentQiStep(yunqiY, ms){
  const bounds = [
    solarTermTimeMs(yunqiY, 300),
    solarTermTimeMs(yunqiY, 0),
    solarTermTimeMs(yunqiY, 60),
    solarTermTimeMs(yunqiY, 120),
    solarTermTimeMs(yunqiY, 180),
    solarTermTimeMs(yunqiY, 240)
  ];
  let step = 5;
  if (ms < bounds[0]) { step = 5; }
  else for (let i = 0; i < 6; i++){
    const next = (i === 5) ? solarTermTimeMs(yunqiY + 1, 300) : bounds[i + 1];
    if (ms >= bounds[i] && ms < next){ step = i; break; }
  }
  return step;
}

/* ================= 综合计算 ================= */
function calcAll(d, opts){
  opts = opts || {lateZiNextDay:true, fiveMode:'kun', sex:'male'};
  const y = d.getFullYear(), mo = d.getMonth() + 1, da = d.getDate();
  const h = d.getHours(), mi = d.getMinutes();
  const d0 = dayGanzhiIndex(y, mo, da);
  const dayG = (opts.lateZiNextDay && h >= 23) ? mod(d0 + 1, 60) : d0;
  const dg = mod(dayG, 10), dz = mod(dayG, 12);
  const hb = hourBranchIdx(h);
  const hs = hourStem(dg, hb);
  /* 月支 */
  let mb = 10;
  const JIE_L = [315,345,15,45,75,105,135,165,195,225,255];
  const nowMs = d.getTime();
  for (let i = 0; i < 11; i++){
    if (solarTermTimeMs(y, JIE_L[i]) <= nowMs) mb = i;
  }
  const xhMs = solarTermTimeMs(y, 285), lcMs = solarTermTimeMs(y, 315);
  if (xhMs <= nowMs && nowMs < lcMs) mb = 11;
  /* 年干支 */
  const lichunMs = solarTermTimeMs(y, 315);
  const yyGan = mod(y - 1984, 60);
  const yg = (nowMs >= lichunMs) ? mod(yyGan, 10) : mod(yyGan - 1, 10);
  const yz = (nowMs >= lichunMs) ? mod(yyGan, 12) : mod(yyGan - 1, 12);
  const mg = monthStem(yg, mb);
  const lunar = lunarInfo(y, mo, da);
  /* 各法开穴 */
  const nj = najiaOpen(dg, hs, hb);
  const njHeRi = nj ? null : najiaHeRi(dg, hs, hb);
  const nz = NAZI[hb];
  const lg = lingguiOpen(dayG, hs, hb, opts);
  const ft = FEITENG[hs];
  const wm = WM_HEHUA.find(x => x.a === GAN[dg] || x.b === GAN[dg]);
  const yunqiY = (nowMs >= lichunMs) ? y : y - 1;
  const yq = yunqiYearData(yunqiY);
  const curStep = currentQiStep(y, nowMs);
  const todayTerm = TERMS.filter(t => {
    const ms = solarTermTimeMs(y, t.l);
    const dd = new Date(ms);
    return dd.getFullYear() === y && dd.getMonth() + 1 === mo && dd.getDate() === da;
  }).map(t => t.n);
  return {y, mo, da, h, mi, d0, dayG, dg, dz, hb, hs, mb, mg, yg, yz, lunar, nj, njHeRi, nz, lg, ft, wm,
          yunqiY, yq, curStep, todayTerm, ganName: GAN[dg], zhiName: ZHI[dz],
          hourGanziName: GAN[hs] + ZHI[hb], dayGanziName: ganziName(dayG),
          yearGanziName: ganziName((nowMs >= lichunMs) ? yyGan : mod(yyGan - 1, 60)),
          monthGanziName: GAN[mg] + ZHI[mod(mb + 2, 12)]};
}
function dayTable(d, opts){
  opts = opts || {lateZiNextDay:true, fiveMode:'kun', sex:'male'};
  const y = d.getFullYear(), mo = d.getMonth() + 1, da = d.getDate();
  const d0 = dayGanzhiIndex(y, mo, da);
  const dayG = (opts.lateZiNextDay && d.getHours() >= 23) ? mod(d0 + 1, 60) : d0;
  const dg = mod(dayG, 10);
  const rows = [];
  for (let b = 0; b < 12; b++){
    const hs2 = hourStem(dg, b);
    const nj2 = najiaOpen(dg, hs2, b);
    const nj2hr = nj2 ? null : najiaHeRi(dg, hs2, b);
    const lg2 = lingguiOpen(dayG, hs2, b, opts);
    const ft2 = FEITENG[hs2];
    const startH = mod(b * 2 - 1, 24);
    rows.push({b, hs: hs2, startH, nj: nj2, njHeRi: nj2hr, lg: lg2, ft: ft2});
  }
  return {dg, rows};
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hourSpan = h => { const s = mod(h - 1, 24); return pad2(s) + ':00–' + pad2((s + 2) % 24) + ':00'; };

const state = { follow: true, sel: new Date(), calY: null, calM: null, yqY: null };
let lastText = '';

function getOpts(){

    lateZiNextDay: $('optLateZi').checked,
    fiveMode: $('optFive').value,
    sex: $('optSex').value,
    autoRefresh: $('optAuto').checked
  };
}

/* Tab 切换 */
document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));

/* 时钟 */
function tick(){
  const now = new Date();
  $('clockTime').textContent = pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds());
  const c = calcAll(now, getOpts());
  $('clockGanzi').textContent = c.dayGanziName + ' ' + c.hourGanziName + '时';
  if (state.follow){
    state.sel = now;
    if (now.getSeconds() === 0 || !$('ganzhiSummary').innerHTML){
      renderOpen();
    }
  }
}
setInterval(tick, 1000);

/* 自动刷新（每分钟） */
let autoTimer = null;
function startAuto(){
  stopAuto();
  if ($('optAuto').checked) autoTimer = setInterval(() => { if (state.follow) renderOpen(); }, 60000);
}
function stopAuto(){ if (autoTimer){ clearInterval(autoTimer); autoTimer = null; } }

/* 控件 */
$('optFollow').addEventListener('change', e => {
  state.follow = e.target.checked;
  if (state.follow){ state.sel = new Date(); renderOpen(); }
});
$('btnNow').addEventListener('click', () => {
  state.follow = true; $('optFollow').checked = true;
  state.sel = new Date(); renderOpen();
});
$('optLateZi').addEventListener('change', renderOpen);
$('optFive').addEventListener('change', () => { updateSexVisibility(); renderOpen(); });
$('optSex').addEventListener('change', renderOpen);
$('optAuto').addEventListener('change', () => {
  if ($('optAuto').checked){ startAuto(); if (state.follow) renderOpen(); }
  else stopAuto();
});
$('dateInput').addEventListener('change', e => {
  state.follow = false; $('optFollow').checked = false;
  const [yy, mm, dd] = e.target.value.split('-').map(Number);
  const t = new Date(state.sel);
  state.sel = new Date(yy, mm - 1, dd, t.getHours(), t.getMinutes());
  renderOpen();
});
$('timeInput').addEventListener('change', e => {
  state.follow = false; $('optFollow').checked = false;
  const [hh, mm] = e.target.value.split(':').map(Number);
  const t = new Date(state.sel);
  state.sel = new Date(t.getFullYear(), t.getMonth(), t.getDate(), hh, mm);
  renderOpen();
});

function updateSexVisibility(){
  const genderMode = $('optFive').value === 'gender';
  $('optSex').disabled = !genderMode;
  $('sexOptBox').classList.toggle('disabled', !genderMode);
}

/* 复制 & 打印 */
$('btnPrint').addEventListener('click', () => window.print());
$('btnCopy').addEventListener('click', async () => {
  if (!lastText){ renderOpen(); }
  if (!lastText) return;
  try {
    if (navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(lastText);
    } else {
      const ta = document.createElement('textarea');
      ta.value = lastText;
      ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    showToast('✓ 已复制到剪贴板');
  } catch (err){
    showToast('✗ 复制失败，请手动选择结果复制');
  }
});
let toastTimer = null;
function showToast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

  lines.push('  配穴：' + c.lg.peidui + '（' + c.lg.peiduiMai + '）');

  lines.push('  定位：' + c.lg.gua[1] + ' → ' + pointLoc(c.lg.gua[1]));
  lines.push('        ' + c.lg.peidui + ' → ' + pointLoc(c.lg.peidui));
  lines.push('');

  lines.push('  本穴：' + c.nz.jing.split(':')[1] + '；原穴：' + c.nz.yuan);
  lines.push('  虚则补其母：' + c.nz.mu);
  lines.push('  实则泻其子：' + c.nz.zi);
  lines.push('');
  lines.push('【纳甲法】');

  if (c.nj){

    if (c.nj.yuan) lines.push('  返本还原：' + c.nj.yuan);

  lines.push('穴位定位为教材标准取法；针刺请由专业医师操作。');
  return lines.join('\n');
}

/* ---------- 即时开穴渲染 ---------- */
function pointChip(pt, extra){
  return '<span class="point-chip" title="' + esc(pointLoc(pt.point)) + '"><b>' + esc(pt.point) + '</b>（' +
         esc(pt.meridian.replace('经','')) + (pt.type ? '·' + esc(pt.type) : '') + '）' + extra + '</span>';
}
function typeName(t){
  return {井:'井穴',荥:'荥穴',输:'输穴',经:'经穴',合:'合穴',
          '纳三焦':'气纳三焦', '纳包络':'血纳包络'}[t] || t;
}
function badgeCls(f){
  if (f.indexOf('纳甲') >= 0) return 'nj';
  if (f.indexOf('纳子') >= 0) return 'nz';
  if (f.indexOf('灵龟') >= 0) return 'lg';
  if (f.indexOf('飞腾') >= 0) return 'ft';
  return 'wm';
}

  const c = calcAll(state.sel, opts);
  $('dateInput').value = c.y + '-' + pad2(c.mo) + '-' + pad2(c.da);
  $('timeInput').value = pad2(c.h) + ':' + pad2(c.mi);

  /* 保存复制文本 */
  lastText = buildResultText(c, opts);

  /* 干支摘要 */

    '<h3>📜 当下干支 <span class="tag">' + esc(c.dayGanziName) + '日</span></h3>' +

    '<div><span class="small">月干支</span><br><b>' + esc(c.monthGanziName) + '月</b></div>' +
    '<div><span class="small">日干支</span><br><b>' + esc(c.dayGanziName) + '日</b></div>' +

/* ---------- 万年历 ---------- */
function renderCalendar(){
  const now = new Date();
  const y = state.calY || now.getFullYear(), m = state.calM || now.getMonth();
  state.calY = y; state.calM = m;
  $('calTitle').textContent = y + '年' + (m + 1) + '月';
  const first = new Date(y, m, 1);
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const mondayOffset = (first.getDay() + 6) % 7;
  const opts = getOpts();
  let html = '';
  for (let i = 0; i < mondayOffset; i++) html += '<div class="cal-cell other"></div>';
  for (let d = 1; d <= daysInMonth; d++){
    const c = calcAll(new Date(y, m, d, 12), opts);
    const isTerm = c.todayTerm.length;
    const lunarDay = c.lunar.day === 1 ? c.lunar.monthName : c.lunar.dayName;
    const today = (d === now.getDate() && m === now.getMonth() && y === now.getFullYear());
    const sel = (state.sel.getFullYear() === y && state.sel.getMonth() === m && state.sel.getDate() === d);
    const dow = new Date(y, m, d).getDay();
    html += '<div class="cal-cell ' + (isTerm ? 'term' : '') + (today ? ' today' : '') + (sel ? ' selected' : '') +
            (dow === 0 || dow === 6 ? ' weekend' : '') + '" data-d="' + d + '" data-m="' + m + '" data-y="' + y + '">' +
            (isTerm ? '<span class="term-mark">' + esc(c.todayTerm[0]) + '</span>' : '') +
            '<div class="d">' + d + '</div><div class="l">' + esc(isTerm ? c.todayTerm[0] : lunarDay) + '</div>' +
            '<div class="gz">' + esc(c.dayGanziName) + '</div></div>';
  }
  $('calGrid').innerHTML = html;
  document.querySelectorAll('.cal-cell[data-d]').forEach(cell => {
    cell.addEventListener('click', () => {
      const dd = +cell.dataset.d, mm = +cell.dataset.m, yy = +cell.dataset.y;
      state.follow = false; $('optFollow').checked = false;
      state.sel = new Date(yy, mm, dd, state.sel.getHours(), state.sel.getMinutes());
      renderOpen();
      document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === 'open'));
      document.querySelectorAll('section.tab').forEach(s => s.classList.toggle('active', s.id === 'tab-open'));
    });
  });
}
$('calPrev').addEventListener('click', () => { state.calM--; if (state.calM < 0){ state.calM = 11; state.calY--; } renderCalendar(); });
$('calNext').addEventListener('click', () => { state.calM++; if (state.calM > 11){ state.calM = 0; state.calY++; } renderCalendar(); });

    '<div class="poem"><div class="t">飞腾八法歌</div>壬甲公孙即是乾，丙居艮上内关然，戊为临泣生坎水，庚属外关震相连，辛上后溪装巽卦，乙癸申脉到坤传，己土列缺南离上，丁居照海兑金全。</div>' +

    '<li><b>纳甲法</b>：阳日阳时开阳经穴（井→荥→输→经→合），阴日阴时开阴经穴；开输穴时返本还原开当日经原穴；阳日最后一穴气纳三焦、阴日最后一穴血纳包络；阳日阴时/阴日阳时合日互用。</li>' +
    '<li><b>灵龟八法</b>：日干支基数+时干支基数，阳日除九、阴日除六，余数配九宫；余5按「中宫寄坤（照海）」或按性别「男寄坤/女寄艮」处理，可切换。</li>' +
    '<li><b>纳子法</b>：子胆丑肝寅肺卯大肠辰胃巳脾午心未小肠申膀胱酉肾戌心包亥三焦；虚则补其母、实则泻其子，兼用本穴、原穴。</li>' +
    '<li><b>五运六气</b>：天干化运、地支化气、阳干太过阴干不及；岁运以立春交接；客气以司天为三之气顺三阴三阳序排；客主加临判顺逆。</li>' +
    '<li><b>节气与农历</b>：采用 lunar-javascript（Meeus 天文算法），误差约数分钟。</li>' +
